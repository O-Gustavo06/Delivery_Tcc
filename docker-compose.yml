services:
  db:
    image: mariadb:11
    container_name: restaurante_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: estudos
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./backend
    container_name: restaurante_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      # php artisan serve reabre o arquivo .env do disco a cada request (nao so herda a env
      # var do processo pai) - por isso precisa sobrepor .env.docker DIRETO no caminho /.env,
      # sem tocar no backend/.env que o XAMPP continua usando fora do Docker.
      - ./backend/.env.docker:/var/www/html/.env:ro
      - ./backend/.env.testing.docker:/var/www/html/.env.testing:ro
      # vendor/storage/bootstrap-cache ficam em volumes nativos do Docker, nao no bind mount
      # do Windows: I/O de milhares de arquivos pequenos (autoload, sessao, cache, log) por um
      # bind mount Windows<->WSL2 e MUITO mais lento que um volume nativo (chegava a 20-30s por
      # request). Codigo continua editavel ao vivo via bind mount; so essas 3 pastas sao rapidas.
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache

  # --- Integracao WhatsApp (Evolution API) ---------------------------------------------
  # Camada de comunicacao com o WhatsApp usada pelo backend (App\Services\WhatsApp). O
  # backend fala com ela via rede interna do Docker (EVOLUTION_API_URL=http://evolution-api:8080
  # no backend/.env.docker); nada aqui muda o servico "app"/"db" ja existente.
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    build:
      context: ./evolution-api
    container_name: evolution_api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  db_data:
  app_vendor:
  app_storage:
  app_bootstrap_cache:
  evolution_pg_data:
  evolution_redis_data:
  evolution_instances:
